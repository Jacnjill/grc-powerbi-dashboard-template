{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <!-- Comments use giscus (GitHub Discussions). The giscus GitHub App must be
       installed on this repository: https://github.com/apps/giscus
       The Comments category could not be created via API; this site uses the
       default Announcements category (announcement format, which giscus recommends). -->
  <script src="https://giscus.app/client.js"
          data-repo="Jacnjill/grc-powerbi-dashboard-template"
          data-repo-id="R_kgDOVqxk-Q"
          data-category="Announcements"
          data-category-id="DIC_kwDOVqxk-c4DK5T4"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="en"
          crossorigin="anonymous"
          async>
  </script>
{% endif %}
